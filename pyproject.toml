[project]
name = "apex-pipeline"
version = "2.0.2"
description = "Four Apex nodes for Krea 2 generation, LoRA control, metadata-aware saves and a resizable image preview."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Apex Lightspeed" }]
keywords = ["comfyui", "custom-nodes", "krea2", "image-generation", "lora", "metadata"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Repository = "https://github.com/ApexLightSpeed/ComfyUI_ApexPipeline"
Issues = "https://github.com/ApexLightSpeed/ComfyUI_ApexPipeline/issues"

[tool.comfy]
PublisherId = "apexlightspeed"
DisplayName = "Apex Pipeline"
requires-comfyui = ">=0.26.0"
includes = ["web", "workflows"]
